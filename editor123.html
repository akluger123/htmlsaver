<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ultimate AI Web Editor</title>
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --text: #f8fafc; --accent: #38bdf8; }
        body { margin: 0; font-family: 'Inter', sans-serif; height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--text); }
        
        /* Setup Bar */
        .setup-bar { background: #000; padding: 10px 20px; display: flex; gap: 10px; border-bottom: 1px solid #334155; font-size: 12px; }
        .setup-bar input { background: #1e293b; border: 1px solid #334155; color: white; padding: 5px 10px; border-radius: 4px; width: 250px; }

        /* AI Command Center */
        .ai-header { background: var(--panel); padding: 15px 20px; display: flex; gap: 12px; align-items: center; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        #ai-prompt { flex-grow: 1; padding: 12px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 15px; }
        
        /* Buttons */
        .btn { padding: 10px 20px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-ai { background: var(--accent); color: #000; }
        .btn-ship { background: #22c55e; color: white; }
        .btn:hover { opacity: 0.8; transform: translateY(-1px); }

        /* Editor Layout */
        .workspace { display: flex; flex-grow: 1; overflow: hidden; }
        .editor-box { width: 50%; display: flex; flex-direction: column; border-right: 1px solid #334155; }
        .preview-box { width: 50%; background: white; }
        
        textarea { flex-grow: 1; background: #1e293b; color: #94a3b8; font-family: 'Fira Code', monospace; font-size: 14px; padding: 20px; border: none; outline: none; resize: none; line-height: 1.6; }
        iframe { width: 100%; height: 100%; border: none; }
        .label { background: #334155; font-size: 11px; padding: 4px 12px; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="setup-bar">
        <span>OpenAI Key:</span> <input type="password" id="openai-key" placeholder="Paste sk-... here">
        <span>Netlify Site URL:</span> <input type="text" id="site-url" placeholder="example.netlify.app">
        <button class="btn" style="padding: 5px 10px;" onclick="loadFromNetlify()">Load Site</button>
    </div>

    <div class="ai-header">
        <input type="text" id="ai-prompt" placeholder="Describe the changes you want (e.g., 'Add a dark mode toggle and a hero section')">
        <button class="btn btn-ai" id="ai-btn" onclick="askAI()">Ask AI to Code</button>
        <button class="btn btn-ship" onclick="deploy()">Ship to Netlify</button>
    </div>

    <div class="workspace">
        <div class="editor-box">
            <div class="label">HTML Source Code</div>
            <textarea id="code-editor" oninput="updatePreview()"></textarea>
        </div>
        <div class="preview-box">
            <div class="label" style="color: #64748b;">Live Preview</div>
            <iframe id="live-view"></iframe>
        </div>
    </div>

    <script>
        const editor = document.getElementById('code-editor');
        const preview = document.getElementById('live-view');
        const aiBtn = document.getElementById('ai-btn');

        function updatePreview() {
            const doc = preview.contentWindow.document;
            doc.open();
            doc.write(editor.value);
            doc.close();
        }

        // FETCH CODE FROM LIVE SITE
        async function loadFromNetlify() {
            const url = document.getElementById('site-url').value;
            if(!url) return alert("Enter your netlify URL first!");
            
            try {
                const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('https://' + url)}`);
                const data = await res.json();
                editor.value = data.contents;
                updatePreview();
            } catch(e) { alert("Error loading site code."); }
        }

        // REAL OPENAI INTEGRATION
        async function askAI() {
            const apiKey = document.getElementById('openai-key').value;
            const prompt = document.getElementById('ai-prompt').value;
            const currentCode = editor.value;

            if(!apiKey) return alert("PLEASE INPUT YOUR OPENAI API KEY AT THE TOP!");
            if(!prompt) return alert("Tell the AI what to do!");

            aiBtn.innerText = "AI is coding...";
            aiBtn.style.opacity = "0.5";

            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "gpt-4o", // You can use "gpt-3.5-turbo" if you prefer
                        messages: [
                            { role: "system", content: "You are an expert web developer. Return ONLY the full HTML code. No explanations, no markdown blocks." },
                            { role: "user", content: `Here is my current code:\n${currentCode}\n\nTask: ${prompt}` }
                        ]
                    })
                });

                const data = await response.json();
                let newCode = data.choices[0].message.content;
                
                // Clean up any AI markdown if it appears
                newCode = newCode.replace(/```html/g, "").replace(/```/g, "");

                editor.value = newCode;
                updatePreview();
            } catch (error) {
                console.error(error);
                alert("AI Error: Check your API key and balance.");
            } finally {
                aiBtn.innerText = "Ask AI to Code";
                aiBtn.style.opacity = "1";
            }
        }

        function deploy() {
            alert("Changes ready! To finalize, copy the code and push it to your Netlify Git repo or drag-drop the folder back to Netlify.");
        }
    </script>
</body>
</html>
