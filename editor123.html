<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Netlify AI Ship-It Editor</title>
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --text: #f8fafc; --accent: #38bdf8; --netlify: #00ad9f; }
        body { margin: 0; font-family: 'Inter', sans-serif; height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--text); }
        
        /* HEADER: KEYS SECTION */
        .config-header { background: #000; padding: 15px 20px; display: flex; gap: 20px; border-bottom: 2px solid #334155; align-items: flex-end; }
        .key-box { display: flex; flex-direction: column; gap: 5px; }
        .key-box label { font-size: 10px; font-weight: bold; color: #64748b; text-transform: uppercase; }
        .key-box input { background: #1e293b; border: 1px solid #334155; color: white; padding: 8px; border-radius: 4px; width: 200px; }

        /* AI COMMAND BAR */
        .ai-bar { background: var(--panel); padding: 15px 20px; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid #334155; }
        #ai-prompt { flex-grow: 1; padding: 12px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; }
        
        .btn { padding: 10px 18px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-ai { background: var(--accent); color: #000; }
        .btn-ship { background: var(--netlify); color: white; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* WORKSPACE */
        .workspace { display: flex; flex-grow: 1; overflow: hidden; }
        .editor-section { width: 50%; display: flex; flex-direction: column; border-right: 1px solid #334155; }
        .preview-section { width: 50%; background: white; }
        textarea { flex-grow: 1; background: #1e293b; color: #94a3b8; font-family: monospace; font-size: 13px; padding: 20px; border: none; outline: none; resize: none; }
        iframe { width: 100%; height: 100%; border: none; }
        .tag { background: #334155; font-size: 10px; padding: 4px 12px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="config-header">
        <div class="key-box">
            <label>OpenAI API Key (sk-...)</label>
            <input type="password" id="openai-key" placeholder="Paste OpenAI Key">
        </div>
        <div class="key-box">
            <label>Netlify API Token</label>
            <input type="password" id="netlify-key" placeholder="Paste Netlify Token">
        </div>
        <div class="key-box">
            <label>Netlify Site API ID</label>
            <input type="text" id="site-id" placeholder="API ID from Settings">
        </div>
        <button class="btn" style="background: #475569; color: white;" onclick="loadCurrentSite()">Load Code</button>
    </div>

    <div class="ai-bar">
        <input type="text" id="ai-prompt" placeholder="Ask AI: 'Add a big red button' or 'Make the background yellow'">
        <button class="btn btn-ai" id="ai-btn" onclick="runAI()">Ask AI to Code</button>
        <button class="btn btn-ship" id="ship-btn" onclick="shipIt()">Ship to Netlify</button>
    </div>

    <div class="workspace">
        <div class="editor-section">
            <div class="tag">Source Code</div>
            <textarea id="editor" oninput="updatePreview()" placeholder="Paste your HTML here or load from Netlify..."></textarea>
        </div>
        <div class="preview-section">
            <div class="tag" style="background: #e2e8f0; color: #64748b;">Live Preview</div>
            <iframe id="preview"></iframe>
        </div>
    </div>

    <script>
        const editor = document.getElementById('editor');
        const preview = document.getElementById('preview');
        // Proxy to bypass browser security (CORS)
        const PROXY = "https://cors-anywhere.herokuapp.com/";

        function updatePreview() {
            const doc = preview.contentWindow.document;
            doc.open();
            doc.write(editor.value);
            doc.close();
        }

        async function loadCurrentSite() {
            const siteId = document.getElementById('site-id').value;
            if(!siteId) return alert("Enter your Site ID first!");
            try {
                // We use a proxy to grab the code from your live URL
                const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('https://' + siteId)}`);
                const data = await res.json();
                editor.value = data.contents;
                updatePreview();
            } catch(e) { alert("Couldn't load site. You can paste your code manually instead."); }
        }

        async function runAI() {
            const key = document.getElementById('openai-key').value.trim();
            const prompt = document.getElementById('ai-prompt').value;
            if(!key) return alert("PASTE YOUR OPENAI KEY IN THE TOP BOX!");

            const btn = document.getElementById('ai-btn');
            btn.innerText = "AI is writing code...";
            btn.disabled = true;

            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${key}`
                    },
                    body: JSON.stringify({
                        model: "gpt-4o",
                        messages: [
                            { role: "system", content: "You are a coding agent. Return ONLY the updated HTML. No markdown, no notes." },
                            { role: "user", content: `Current Code:\n${editor.value}\n\nChange requested: ${prompt}` }
                        ]
                    })
                });

                const data = await response.json();
                if(data.error) throw new Error(data.error.message);
                
                let code = data.choices[0].message.content;
                editor.value = code.replace(/```html|```/g, "").trim();
                updatePreview();
            } catch (e) {
                alert("AI Error: " + e.message);
            } finally {
                btn.innerText = "Ask AI to Code";
                btn.disabled = false;
            }
        }

        async function shipIt() {
            const token = document.getElementById('netlify-key').value.trim();
            const siteId = document.getElementById('site-id').value.trim();
            if(!token || !siteId) return alert("PASTE YOUR NETLIFY KEY AND SITE ID!");

            const btn = document.getElementById('ship-btn');
            btn.innerText = "Shipping...";
            btn.disabled = true;

            try {
                const res = await fetch(`https://api.netlify.com/api/v1/sites/${siteId}/deploys`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ files: { "index.html": editor.value } })
                });

                if(res.ok) alert("🚀 Success! Your site is updating.");
                else alert("Netlify Error. Check your Site ID and Token.");
            } catch(e) { alert("Shipping failed: " + e.message); }
            finally {
                btn.innerText = "Ship to Netlify";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
