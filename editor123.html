<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI + Netlify Live Editor</title>
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --text: #f8fafc; --accent: #38bdf8; --netlify: #00ad9f; }
        body { margin: 0; font-family: 'Inter', sans-serif; height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--text); }
        
        /* THE KEY BOXES SECTION */
        .config-header { background: #000; padding: 15px 20px; display: flex; gap: 20px; border-bottom: 2px solid #334155; flex-wrap: wrap; align-items: center; }
        .key-input-group { display: flex; flex-direction: column; gap: 5px; }
        .key-input-group label { font-size: 11px; font-weight: bold; color: #94a3b8; text-transform: uppercase; }
        .key-input-group input { background: #1e293b; border: 1px solid #334155; color: white; padding: 8px; border-radius: 4px; width: 220px; }

        /* AI COMMAND BAR */
        .ai-bar { background: var(--panel); padding: 15px 20px; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid #334155; }
        #ai-prompt { flex-grow: 1; padding: 12px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 14px; }
        
        /* BUTTONS */
        .btn { padding: 10px 18px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; height: 40px; }
        .btn-load { background: #64748b; color: white; margin-top: 15px; }
        .btn-ai { background: var(--accent); color: #000; }
        .btn-ship { background: var(--netlify); color: white; }
        .btn:hover { opacity: 0.8; }

        /* EDITOR WORKSPACE */
        .workspace { display: flex; flex-grow: 1; overflow: hidden; }
        .editor-box { width: 50%; display: flex; flex-direction: column; border-right: 1px solid #334155; }
        .preview-box { width: 50%; background: white; }
        textarea { flex-grow: 1; background: #1e293b; color: #94a3b8; font-family: 'Fira Code', monospace; font-size: 13px; padding: 20px; border: none; outline: none; resize: none; line-height: 1.6; }
        iframe { width: 100%; height: 100%; border: none; }
        .label-tag { background: #334155; font-size: 10px; padding: 4px 12px; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="config-header">
        <div class="key-input-group">
            <label>1. OpenAI API Key</label>
            <input type="password" id="openai-key" placeholder="Paste sk-...">
        </div>
        <div class="key-input-group">
            <label>2. Netlify API Token</label>
            <input type="password" id="netlify-token" placeholder="Paste Netlify Token">
        </div>
        <div class="key-input-group">
            <label>3. Netlify Site API ID</label>
            <input type="text" id="site-id" placeholder="e.g. 1a2b3c4d...">
        </div>
        <button class="btn btn-load" onclick="loadSite()">Connect Site</button>
    </div>

    <div class="ai-bar">
        <input type="text" id="ai-prompt" placeholder="Tell the AI what to build or change...">
        <button class="btn btn-ai" id="ai-btn" onclick="askAI()">Ask AI to Code</button>
        <button class="btn btn-ship" id="ship-btn" onclick="shipToNetlify()">Ship to Netlify</button>
    </div>

    <div class="workspace">
        <div class="editor-box">
            <div class="label-tag">HTML Source Code</div>
            <textarea id="code-editor" oninput="updatePreview()" placeholder="Your code will appear here..."></textarea>
        </div>
        <div class="preview-box">
            <div class="label-tag" style="color: #64748b; background: #e2e8f0;">Live Preview</div>
            <iframe id="live-view"></iframe>
        </div>
    </div>

    <script>
        const editor = document.getElementById('code-editor');
        const preview = document.getElementById('live-view');

        function updatePreview() {
            const doc = preview.contentWindow.document;
            doc.open();
            doc.write(editor.value);
            doc.close();
        }

        // --- STEP 1: LOAD YOUR CODE ---
        async function loadSite() {
            const siteId = document.getElementById('site-id').value;
            if(!siteId) return alert("Please enter your Site ID!");
            
            // Note: Browsers block direct 'fetch' from other sites due to CORS. 
            // We use a proxy here so you can see your site code in the editor.
            try {
                const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('https://' + siteId)}`);
                const data = await res.json();
                editor.value = data.contents || "";
                updatePreview();
            } catch(e) { alert("Error loading site content. You can also paste code manually."); }
        }

        // --- STEP 2: ASK THE AI BRAIN ---
        async function askAI() {
            const aiKey = document.getElementById('openai-key').value;
            const prompt = document.getElementById('ai-prompt').value;
            if(!aiKey) return alert("REQUIRED: Please paste your OpenAI Key in the top box.");
            
            const btn = document.getElementById('ai-btn');
            btn.innerText = "AI is thinking...";

            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${aiKey}` },
                    body: JSON.stringify({
                        model: "gpt-4o",
                        messages: [
                            { role: "system", content: "You are a pro coder. Return ONLY the full HTML code. No text, no markdown." },
                            { role: "user", content: `Code:\n${editor.value}\n\nTask: ${prompt}` }
                        ]
                    })
                });
                const data = await response.json();
                let newCode = data.choices[0].message.content;
                editor.value = newCode.replace(/```html|```/g, "");
                updatePreview();
            } catch (e) { alert("AI Error. Check your key/balance."); }
            btn.innerText = "Ask AI to Code";
        }

        // --- STEP 3: SHIP TO NETLIFY ---
        async function shipToNetlify() {
            const token = document.getElementById('netlify-token').value;
            const siteId = document.getElementById('site-id').value;
            if(!token || !siteId) return alert("REQUIRED: Paste your Netlify Token and Site ID first!");

            const btn = document.getElementById('ship-btn');
            btn.innerText = "Shipping...";

            try {
                // This call tells Netlify to replace the site with your new code
                const response = await fetch(`https://api.netlify.com/api/v1/sites/${siteId}/deploys`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ files: { "index.html": editor.value } })
                });

                if(response.ok) { alert("Done! Your site is being updated now."); }
                else { alert("Netlify Error. Check your Token and Site ID."); }
            } catch (e) { alert("Connection Error."); }
            btn.innerText = "Ship to Netlify";
        }
    </script>
</body>
</html>
